[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-reconciler"
version = "1.0.0"
description = "Production-grade, offline-first open-source desktop GST reconciliation software for Windows"
readme = "README.md"
authors = [
    { name = "Open Source GST Reconciler Community" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
keywords = ["gst", "reconciliation", "gstr-2b", "gstr-1", "accounting", "desktop", "offline-first", "india"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "rapidfuzz>=3.5.0",
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/vipranshusachan/gst-reconciler"
Documentation = "https://github.com/vipranshusachan/gst-reconciler#readme"
Repository = "https://github.com/vipranshusachan/gst-reconciler.git"
Issues = "https://github.com/vipranshusachan/gst-reconciler/issues"

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdfplumber>=0.10.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
build = [
    "pyinstaller>=6.3.0",
]
all = [
    "gst-reconciler[ocr,dev,build]",
]

[project.scripts]
gst-reconciler = "app.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
