name: CI & Packaging Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff Linter & Formatter Check
      run: |
        ruff check .
        ruff format --check .

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -v --cov=app --cov-report=xml

  build-windows:
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[build]"

    - name: Build Standalone Executable via PyInstaller
      run: |
        python build_windows.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GSTReconciler-Windows-Dist
        path: dist/

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    - name: Compile Inno Setup Windows Installer (.exe)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss

    - name: Compress Portable Release Archive
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      run: |
        Compress-Archive -Path dist/GSTReconciler -DestinationPath GSTReconciler-Windows-x64.zip -Force

    - name: Upload Binaries to GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/GSTReconciler-Setup-v1.0.0.exe
          GSTReconciler-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
